[project]
name = "ecommerce"
version = "0.1.0"
description = "backend for ecommerce"
readme = "README.md"
authors = [
    { name = "mh-dk", email = "darvazehkashani@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
ecommerce = "ecommerce:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
